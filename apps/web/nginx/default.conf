server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve "api" pelo DNS do Docker a cada requisição (a variável força isso). Sem ela o nginx guarda o IP da
    # subida e, quando a API reinicia com outro IP (ex.: parada do backup), passa a dar 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3101;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos do Vite têm hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca fica em cache, para o deploy novo aparecer na hora.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
